comfy:
  url: http://127.0.0.1:8188
  poll_interval: 1.0
  request_timeout: 30.0
  upload_timeout: 120.0

paths:
  # relative paths are relative to this folder; ~ is your home folder
  comfyui_root: ~/ComfyUI          # your ComfyUI install
  project_root: .
  workflows_dir: workflows
  runs_dir: output                 # one folder per video: deliverables + work/ logs/ scripts/
  refs_dir: refs
  comfy_subfolder: studio2         # subfolder of ComfyUI's input/ and output/ used by this studio

workflows:
  tts: api/tts.api.json
  image: api/image_flux3.api.json
  edit: api/edit_flux3.api.json
  i2v: api/i2v.api.json
  voice_design: api/voice_design.api.json

models:
  flux_unet: flux3-image-klein-int8-convrot.safetensors
  flux_text_encoder: qwen3vl_4b_int8_convrot.safetensors
  flux_vae: flux2-vae.safetensors
  wan_text_encoder: umt5_xxl_fp8_e4m3fn_scaled.safetensors
  wan_vae: Wan2.1_VAE.safetensors
  wan_lora_high: wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
  wan_lora_low: wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
  wan_gguf_high: Wan2.2-I2V-A14B-HighNoise-Q5_K_M.gguf
  wan_gguf_low: Wan2.2-I2V-A14B-LowNoise-Q5_K_M.gguf

media:
  flux:
    width: 1920
    height: 1088
  wan:
    width: 848
    height: 480
    fps: 16
    seconds_per_clip: 5.0
  render:
    width: 1920
    height: 1080
    fps: 30
    crf: 18
    audio_bitrate: 192k
    preset: medium

tts:
  language: English
  narrator_voice: nar.wav
  x_vector_only_mode: false
  asr_use_forced_aligner: true
  output_format: flac
  voice_prefix: ""                # optional: voice files in ComfyUI/models/voices are named <prefix><voice>
  voices:                         # design each with: bin/studio2 voice <name> "<description>"
    - nar

subjects:                     # consistent subjects (script `subjects` block) + automatic likeness check
  portrait_candidates: 3      # reference portraits drawn per subject; the clearest is kept
  portrait_size: 1024
  compose_from_text: true     # draw the scene from text first (composition), then redraw it from the portraits
  denoise: 0.8                # how much the portrait pass may change that layout (lower = closer to the layout)
  check: true                 # compare each subject scene with its portrait; redraw when it does not match
  threshold_person: 0.72      # head similarity a person must reach (calibrated on a storybook illustration style:
                              #   same person 0.76-0.93, different people <= 0.68)
  threshold_thing: 0.65       # whole-subject similarity for everything else (same ship ~0.78, others <= 0.56)
  max_attempts: 3             # drawings per scene before the best is kept and flagged in report.md
  min_area: 0.012             # subjects smaller than this share of the picture are not checked
  python: ~/ComfyUI/venv/bin/python   # ComfyUI's Python (needs torch + transformers)
  device: cpu
  detector: google/owlv2-base-patch16-ensemble
  embedder: facebook/dinov2-base

disk:
  min_free_gb: 10

timeouts:
  tts: 1800
  image: 900
  video: 3600

compose:
  characters_dir: assets/characters/main   # your character library (none yet)
  fonts_dir: assets/fonts
  camera_strength: 0.08
  finish_strength: 0.0      # paper grain/vignette over composed shots (0 = off, 0.35 = a strong paper look)
  ground: 0.965

style:
  # PLACEHOLDER: replace with your channel's art style (added to every picture prompt). End with the no-text rule.
  house: >-
    Clean detailed digital illustration, consistent soft lighting, cohesive muted colour palette.
    Not photorealistic, no text, no letters.
  negative: morphing, distorted face, extra limbs, flicker, text, watermark
