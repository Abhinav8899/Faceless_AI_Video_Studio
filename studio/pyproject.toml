[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio2"
version = "1.2.0"
description = "Faceless AI history video studio: ComfyUI Qwen3-TTS, FLUX 3 Image Klein and Wan 2.2, with code-drawn maps, overlays and sound"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "Pillow>=10",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.7",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
