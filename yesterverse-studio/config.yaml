comfy:
  url: http://127.0.0.1:8188
  poll_interval: 1.0
  request_timeout: 30.0
  upload_timeout: 120.0

paths:
  # "~" works; relative paths are relative to this repo folder
  comfyui_root: ~/ComfyUI
  project_root: .
  workflows_dir: workflows
  runs_dir: output   # one folder per video: deliverables + work/ logs/ scripts/
  refs_dir: refs

workflows:
  tts: api/tts.api.json
  image: api/image.api.json
  edit: api/edit.api.json
  i2v: api/i2v.api.json
  voice_design: api/voice_design.api.json

models:
  flux_unet: flux-2-klein-4b.safetensors
  flux_text_encoder: qwen_3_4b.safetensors
  flux_vae: flux2-vae.safetensors
  wan_text_encoder: umt5_xxl_fp8_e4m3fn_scaled.safetensors
  wan_vae: Wan2.1_VAE.safetensors
  wan_lora_high: wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
  wan_lora_low: wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
  wan_gguf_high: Wan2.2-I2V-A14B-HighNoise-Q5_K_M.gguf
  wan_gguf_low: Wan2.2-I2V-A14B-LowNoise-Q5_K_M.gguf

media:
  flux:
    width: 1920
    height: 1088
  wan:
    width: 848
    height: 480
    fps: 16
    seconds_per_clip: 5.0
  render:
    width: 1920
    height: 1080
    fps: 30
    crf: 18
    audio_bitrate: 192k
    preset: medium

tts:
  language: English
  narrator_voice: nar.wav
  x_vector_only_mode: false
  asr_use_forced_aligner: true
  output_format: flac
  voices:
    - nar
    - inventor
    - apprentice

disk:
  min_free_gb: 10

timeouts:
  tts: 1800
  image: 900
  video: 3600

compose:
  characters_dir: assets/characters/library   # build your own with assets/characters/_tools (see its README)
  fonts_dir: assets/fonts
  camera_strength: 0.08
  finish_strength: 0.35
  ground: 0.965

style:
  house: >-
    Minimalist graphic-novel storybook illustration: simplified cartoon characters with clean dark ink outlines
    and flat cel-shading, backgrounds drawn on aged parchment paper with sepia ink linework and a muted earthy
    watercolor tint (ochre, sienna, faded red, slate), subtle paper grain, lighthearted animated history explainer
    look, no modern objects unless the era has them. Not 3D, not photorealistic, no text, no letters.
  negative: morphing, distorted face, extra limbs, flicker, text, watermark
