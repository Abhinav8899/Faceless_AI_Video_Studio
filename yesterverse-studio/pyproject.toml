[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yesterverse-studio"
version = "1.0.0"
description = "Faceless AI video pipeline orchestrating ComfyUI TTS, FLUX.2 Klein, and Wan2.2"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "Pillow>=10",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.7",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
characters = ["rembg[cpu]>=2.0"]   # only for building a character library (assets/characters/_tools)

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
